<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Stopwatch</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
            padding: 20px;
        }

        .stopwatch {
            width: 100%;
            max-width: 450px;
            padding: 40px 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
        }

        .stopwatch h1 {
            color: white;
            font-size: 32px;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .time-container {
            padding: 25px 10px;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 18px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .time {
            color: #00f5d4;
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(0, 245, 212, 0.6);
        }

        .time-labels {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            color: #d1d5db;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        button {
            min-width: 105px;
            padding: 13px 20px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        }

        button:active {
            transform: scale(0.96);
        }

        #startStop {
            background: linear-gradient(135deg, #00b09b, #96c93d);
        }

        #startStop.stop {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
        }

        #reset {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        #lap {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #222;
        }

        #lapList {
            max-height: 210px;
            overflow-y: auto;
            margin-top: 30px;
            padding-right: 5px;
        }

        .lap-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            margin-bottom: 10px;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            border-left: 4px solid #00f5d4;
        }

        .lap-number {
            color: #00f5d4;
            font-weight: bold;
        }

        #lapList::-webkit-scrollbar {
            width: 6px;
        }

        #lapList::-webkit-scrollbar-thumb {
            background: #00f5d4;
            border-radius: 10px;
        }

        @media screen and (max-width: 500px) {
            .stopwatch {
                padding: 30px 15px;
            }

            .time {
                font-size: 31px;
                letter-spacing: 1px;
            }

            .time-labels {
                font-size: 9px;
            }

            button {
                min-width: 90px;
                padding: 11px 15px;
            }
        }
    </style>
</head>

<body>

    <div class="stopwatch">

        <h1>STOPWATCH</h1>

        <div class="time-container">
            <div class="time">00:00:00:00</div>

            <div class="time-labels">
                <span>HOURS</span>
                <span>MINUTES</span>
                <span>SECONDS</span>
                <span>MILLISECONDS</span>
            </div>
        </div>

        <div class="buttons">
            <button id="startStop">Start</button>
            <button id="reset">Reset</button>
            <button id="lap">Lap</button>
        </div>

        <div id="lapList"></div>

    </div>

    <script>
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;
        let lapCount = 0;
        let isRunning = false;

        const timeDisplay = document.querySelector(".time");
        const startStopButton = document.getElementById("startStop");
        const resetButton = document.getElementById("reset");
        const lapButton = document.getElementById("lap");
        const lapList = document.getElementById("lapList");

        function timeToString(time) {
            let hours = Math.floor(time / 3600000);

            let minutes = Math.floor(
                (time % 3600000) / 60000
            );

            let seconds = Math.floor(
                (time % 60000) / 1000
            );

            let milliseconds = Math.floor(
                (time % 1000) / 10
            );

            let formattedHours = hours
                .toString()
                .padStart(2, "0");

            let formattedMinutes = minutes
                .toString()
                .padStart(2, "0");

            let formattedSeconds = seconds
                .toString()
                .padStart(2, "0");

            let formattedMilliseconds = milliseconds
                .toString()
                .padStart(2, "0");

            return `${formattedHours}:${formattedMinutes}:${formattedSeconds}:${formattedMilliseconds}`;
        }

        function startStopwatch() {
            startTime = Date.now() - elapsedTime;

            timerInterval = setInterval(function () {
                elapsedTime = Date.now() - startTime;
                timeDisplay.textContent = timeToString(elapsedTime);
            }, 10);

            isRunning = true;

            startStopButton.textContent = "Stop";
            startStopButton.classList.add("stop");
        }

        function stopStopwatch() {
            clearInterval(timerInterval);

            timerInterval = null;
            isRunning = false;

            startStopButton.textContent = "Start";
            startStopButton.classList.remove("stop");
        }

        function toggleStartStopwatch() {
            if (isRunning) {
                stopStopwatch();
            } else {
                startStopwatch();
            }
        }

        function resetStopwatch() {
            clearInterval(timerInterval);

            startTime = 0;
            elapsedTime = 0;
            timerInterval = null;
            lapCount = 0;
            isRunning = false;

            timeDisplay.textContent = "00:00:00:00";

            startStopButton.textContent = "Start";
            startStopButton.classList.remove("stop");

            lapList.innerHTML = "";
        }

        function addLap() {
            if (elapsedTime === 0) {
                return;
            }

            lapCount++;

            const lapElement = document.createElement("div");
            lapElement.classList.add("lap-item");

            lapElement.innerHTML = `
                <span class="lap-number">Lap ${lapCount}</span>
                <span>${timeToString(elapsedTime)}</span>
            `;

            lapList.prepend(lapElement);
        }

        startStopButton.addEventListener(
            "click",
            toggleStartStopwatch
        );

        resetButton.addEventListener(
            "click",
            resetStopwatch
        );

        lapButton.addEventListener(
            "click",
            addLap
        );
    </script>

</body>
</html>
